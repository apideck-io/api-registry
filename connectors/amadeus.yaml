id: amadeus
name: "Amadeus for Developers"
apideck: false
notes: "Amadeus for Developers specs from Amadeus' own GitHub organisation (amadeus4dev). Nine more specs in that repository (Airport On-Time Performance, Flight Inspiration Search and other analytics APIs, Tours and Activities, Safe Place) are left out: their endpoints answer 404 on api.amadeus.com."
