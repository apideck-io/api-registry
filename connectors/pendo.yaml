id: pendo
name: "Pendo"
apideck: false
notes: "Pendo publishes no API spec; the auth-only spec below is written here. API access is for approved partners or specific plans."
specs:
  - name: "Pendo API (authentication only)"
    path: "specs/pendo/auth.yaml"
    format: openapi-3.1
    provenance: community
    coverage: auth-only
    server: "https://app.pendo.io"
    notes: "US region. Others: us1.app.pendo.io (US1), app.eu.pendo.io (EU), app.jpn.pendo.io (Japan), app.au.pendo.io (Australia); a key works only on its own region's host. Authentication only: no endpoints. Written from the vendor's developer documentation (engageapi.pendo.io)."
