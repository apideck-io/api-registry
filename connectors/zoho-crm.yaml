id: zoho-crm
name: "Zoho CRM"
specs:
  - name: "Zoho CRM API v8 (per-module OpenAPI bundle)"
    url: "https://github.com/zoho/crm-oas/archive/refs/heads/main.zip"
    format: openapi-3.1
    extract: zip-bundle
    provenance: vendor
    server: "https://zohoapis.{dc}/crm/{version}"
    notes: "Official zoho/crm-oas repo: 103 module files at v8.0/<module>/<module>.yaml (e.g. https://raw.githubusercontent.com/zoho/crm-oas/main/v8.0/record/record.yaml, 10 ops). 452 ops across all files. No licence file. Data-centre-specific host ({dc} = com, eu, in, com.au, jp, ...)."
