id: 1password
name: "1Password"
apideck: false
notes: "Covers the self-hosted 1Password Connect server API."
specs:
  - name: "1Password Connect API"
    url: "https://raw.githubusercontent.com/1Password/connect/main/docs/openapi/spec.yaml"
    format: openapi-3.0
    provenance: vendor
    server: "{scheme}://{connect-host}:{port}/v1"
    notes: "A Connect server listens on http port 8080 by default; put it behind TLS and use https when it is reachable beyond the local network."
