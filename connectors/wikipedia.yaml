id: wikipedia
name: Wikipedia
apideck: false
specs:
- name: MediaWiki REST API
  url: https://en.wikipedia.org/w/rest.php/specs/v0/module/-
  format: openapi-3.0
  provenance: vendor
  server: https://en.wikipedia.org/w/rest.php
  license: CC BY-SA 4.0 (content)
  notes: Core MediaWiki REST endpoints (pages, revisions, search, media) for English Wikipedia, generated by MediaWiki. Other
    language editions serve the same routes on their own host. Reads need no authentication; edits need OAuth. The spec
    also lists test.wikimedia.org as a server for trying write requests. Module list at https://en.wikipedia.org/w/rest.php/specs/v0/discovery.
- name: Attribution API (Beta)
  url: https://en.wikipedia.org/w/rest.php/specs/v0/module/attribution%2Fv0-beta
  format: openapi-3.0
  provenance: vendor
  server: https://en.wikipedia.org/w/rest.php/attribution/v0-beta
  license: CC BY-SA 4.0 (content)
  notes: Beta. Structured attribution data for reusing Wikimedia content. Docs at https://www.mediawiki.org/wiki/Attribution_API.
- name: Wikimedia REST API
  url: https://en.wikipedia.org/api/rest_v1/?spec
  format: openapi-3.0
  provenance: vendor
  server: https://en.wikipedia.org/api/rest_v1
  license: CC BY-SA 4.0 (content)
  notes: The rest_v1 endpoints (page summaries, HTML, media lists, featured feed). The spec declares the relative server
    /api/rest_v1.
- name: Site API
  url: https://en.wikipedia.org/w/rest.php/specs/v0/module/site%2Fv1
  format: openapi-3.0
  provenance: vendor
  server: https://en.wikipedia.org/w/rest.php/site/v1
- name: ReadingLists REST API
  url: https://en.wikipedia.org/w/rest.php/specs/v0/module/readinglists%2Fv0
  format: openapi-3.0
  provenance: vendor
  server: https://en.wikipedia.org/w/rest.php/readinglists/v0
  notes: A signed-in user's saved reading lists; every call needs an authenticated session.
