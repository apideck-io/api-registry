id: datev-unternehmen-online
name: "DATEV Unternehmen Online"
notes: "DATEV publishes one OpenAPI 3.0.x per API product; fetched anonymously from the portal backend (no login). Total 34 operations across the 5 APIs Apideck uses. Portal pages are a JS SPA, so the stable human URL is https://developer.datev.de/de/product-detail/{product}/{version}/overview. dxso-jobs also relies on XSD-defined XML invoice formats (not fetched)."
