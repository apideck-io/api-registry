    provenance: vendor
    server: "https://api.lokalise.com/api2"
  - name: "Lokalise Vantage API"
    url: "https://developers.lokalise.com/openapi/lokalise-vantage-api.yml"
    format: openapi-3.1
    provenance: vendor
  - name: "Lokalise OTA API"
    url: "https://developers.lokalise.com/openapi/ota-2.json"
    format: openapi-3.0
    provenance: vendor
