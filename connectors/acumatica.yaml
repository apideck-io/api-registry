specs:
  - name: "Acumatica contract-based REST (per instance)"
    url: "https://{instance}/entity/Default/{version}/swagger.json"
    format: openapi-3.0
    provenance: vendor
    server: "https://{instance}/entity/Default/{version}"
    manual: login
    notes: "Generated by each Acumatica instance for its endpoint/version (e.g. 24.200.001); requires an instance. Format version not verified (instance-only); historically Swagger 2.0 on older builds. No public static copy found; Acumatica/AcumaticaRESTAPIClientForCSharp on GitHub contains no spec file."
