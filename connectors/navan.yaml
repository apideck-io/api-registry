id: navan
name: "Navan"
notes: "Navan's Expense API is documented in HTML only (https://developer.navan.com/api/), with no machine-readable spec. developer.navan.com also hosts an MCP page (/mcp/)."
specs:
  - name: "Navan Booking Data API"
    url: "https://app.navan.com/api/public-api.yml"
    format: openapi-3.0
    provenance: vendor
    server: "https://api.navan.com"
    overlay: overlays/navan.yaml
    notes: "Served behind Navan's Swagger UI (https://app.navan.com/swagger-ui/index.html, listed in /v3/api-docs/swagger-config). The spec declares no servers; calls go to api.navan.com with an OAuth 2.0 client-credentials token from https://app.navan.com/ta-auth/oauth/token (scope bookings:read). Date filters are Unix timestamps."
