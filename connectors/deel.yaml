id: deel
name: "Deel"
notes: "Fetchable vendor OpenAPI 3.1."
specs:
  - name: "Deel API (combined endpoints)"
    url: "https://developer.deel.com/openapi/endpoints-5.json"
    format: openapi-3.1
    provenance: vendor
    server: "https://api.letsdeel.com/rest"
    notes: "Index at https://developer.deel.com/openapi.json (an HTML page despite the name) lists 10 per-product OpenAPI files under /openapi/ (endpoints, eor-endpoints-2, eor-worker-endpoints-2, ic-endpoints, endpoints-3, hris-endpoints, ats-endpoints, platform-endpoints, endpoints-4, endpoints-5). endpoints-5.json is a strict superset: union of all 10 = 541 path x method, all present in endpoints-5. No stable URL exists: the index only links generated, numbered filenames, so this URL is fragile and the nightly check will report a 404 when the number shifts; re-resolve from the index then. hris-endpoints.json (61 ops) is the HRIS subset."
