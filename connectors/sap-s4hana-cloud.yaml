id: sap-s4hana-cloud
name: "SAP S/4HANA Cloud"
notes: "SAP Business Accelerator Hub publishes EDMX and OpenAPI per API; downloads need an SAP account, so these are recorded as manual. More finance APIs live alongside them on api.sap.com."
specs:
  - name: "Business Partner (A2X)"
    url: "https://api.sap.com/api/API_BUSINESS_PARTNER/overview"
    format: odata-edmx
    provenance: vendor
    manual: login
    notes: "Sign in to api.sap.com, open the API, then API Specification → download EDMX or OpenAPI JSON."
  - name: "Journal Entry Item - Read"
    url: "https://api.sap.com/api/API_JOURNALENTRYITEMBASIC_SRV/overview"
    format: odata-edmx
    provenance: vendor
    manual: login
    notes: "Sign in to api.sap.com, open the API, then API Specification → download EDMX or OpenAPI JSON."
  - name: "Supplier Invoice - Process"
    url: "https://api.sap.com/api/API_SUPPLIERINVOICE_PROCESS_SRV/overview"
    format: odata-edmx
    provenance: vendor
    manual: login
    notes: "Sign in to api.sap.com, open the API, then API Specification → download EDMX or OpenAPI JSON."
