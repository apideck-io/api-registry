id: snipe-it
name: "Snipe-IT"
apideck: false
specs:
  - name: "snipe-it-rest-api"
    url: "https://snipe-it.readme.io/openapi/snipe-it-rest-api.json"
    format: openapi-3.1
    provenance: vendor
    server: "https://{hostname}/api/v1"
