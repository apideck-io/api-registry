id: nextcloud
name: "Next Cloud OCS"
apideck: false
specs:
  - name: "core"
    url: "https://raw.githubusercontent.com/nextcloud/server/master/core/openapi.json"
    format: openapi-3.0
    provenance: vendor
    server: "https://{domain}"
    notes: "{domain} is the self-hosted Nextcloud domain, usually HTTPS; an install without TLS or on another port needs that scheme and port instead. Paths include /ocs/v2.php/...; basic auth (user + app password); OCS requests need the 'OCS-APIRequest: true' header. This is core only: each app ships its own openapi.json."
