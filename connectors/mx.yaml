specs:
  - name: "Platform API 2026"
    url: "https://docs.mx.com/openapi/platform-api/v20260929.yaml"
    format: openapi-3.1
    provenance: vendor
    server: "https://api.mx.com"
    notes: "Production server; the spec also lists int-api.mx.com."
  - name: "MX Platform API (platform-api/v20250224)"
    url: "https://docs.mx.com/openapi/platform-api/v20250224.yaml"
    format: openapi-3.0
    provenance: vendor
    server: "https://api.mx.com"
    notes: "Production server; the spec also lists int-api.mx.com."
  - name: "MX Platform API (platform-api/v20111101)"
    url: "https://docs.mx.com/openapi/platform-api/v20111101.yaml"
    format: openapi-3.0
    provenance: vendor
    server: "https://api.mx.com"
    notes: "Production server; the spec also lists int-api.mx.com."
  - name: "Nexus API"
    url: "https://docs.mx.com/openapi/nexus/v1.yaml"
    format: openapi-3.0
    provenance: vendor
    server: "https://data.moneydesktop.com"
    notes: "Production server; the spec also lists int-data.moneydesktop.com (integration)."
