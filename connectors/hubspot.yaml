notes: "HubSpot publishes one OpenAPI per API product (125 in the index at https://api.hubspot.com/public/api/spec/v1/specs; also github.com/HubSpot/HubSpot-public-api-spec-collection). Only the core CRM specs used by the crm/lead connector were fetched and counted; the rest are reachable from the index."
