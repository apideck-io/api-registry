id: confluence-data-center
name: "Confluence Data Center"
apideck: false
specs:
  - name: "Confluence Data Center"
    url: "https://developer.atlassian.com/server/confluence/10.0.0.swagger.v3.json"
    format: openapi-3.0
    provenance: vendor
    server: "https://{baseurl}/confluence"
    notes: "{baseurl} is the self-hosted instance. A default install without a proxy serves plain HTTP on port 8090, and the /confluence context path can be changed or empty. Spec security: HTTP basic; Data Center also accepts personal access tokens as Bearer."
