    provenance: vendor
    server: "https://api.clover.com"
    notes: "From oasPublicUrl '@clover-platform/v3#1836s2z4smohp2458' on docs.clover.com reference pages (e.g. https://docs.clover.com/dev/reference/customersgetcustomers). Registry UUIDs can change on re-sync. The spec lists only the sandbox https://apisandbox.dev.clover.com; the server here is the North America production host (EU: https://api.eu.clover.com, LA: https://api.la.clover.com)."
