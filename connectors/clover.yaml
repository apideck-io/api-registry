id: clover
name: "Clover"
notes: "ReadMe-hosted docs at https://docs.clover.com/dev/reference/api-reference-overview, split into several definitions under @clover-platform/v3. Indexed: Platform API and Ecommerce Service API. Also found, not indexed: Multiple service charge (MSC) Pilot APIs (#17440ljmod6cyth), Gift card Tokenization Service API (#3yii2i91jm22yqbyg) and Clover Card Present REST API (#adhg9modeou8f, a device-local API). PAKMS and Recurring definitions were not resolved; definitions were found by sampling 26 of ~309 reference pages, so more may exist."
specs:
