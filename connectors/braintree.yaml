id: braintree
name: "Braintree"
apideck: false
specs:
  - name: "Braintree GraphQL schema"
    url: "https://raw.githubusercontent.com/braintree/graphql-api/master/schema.graphql"
    format: graphql
    provenance: vendor
    server: "https://payments.braintree-api.com/graphql"
    notes: "Official braintree/graphql-api repo (SDL); sandbox at https://payments.sandbox.braintree-api.com/graphql. graphql-js rejects the SDL as published (InStoreContext.id is deprecated while the Node.id it implements is not), so no introspection result is derived and index.json records derivedError; the endpoint itself needs an API key, so there is no introspection fallback."
