id: thrivecart
name: "ThriveCart"
apideck: false
notes: "ThriveCart publishes no API spec; the auth-only spec below is written here."
specs:
  - name: "ThriveCart API (authentication only)"
    path: "specs/thrivecart/auth.yaml"
