overlay: 1.0.0
info:
  title: Square spec fixes
  version: 1.0.0
extends: https://raw.githubusercontent.com/square/connect-api-specification/master/api.json
actions:
  - target: "$.paths['/v2/vendors/{vendor_id}'].put"
    description: UpdateVendor puts {vendor_id} in its path but declares no parameters, so a generated client can't fill it.
    update:
      parameters:
        - name: vendor_id
          in: path
          required: true
          description: The ID of the vendor to update.
          schema:
            type: string
