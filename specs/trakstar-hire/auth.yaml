openapi: 3.1.0
info:
  title: Trakstar Hire API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Trakstar Hire API: its host and HTTP basic credentials. It lists no endpoints. Trakstar Hire publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /openings refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /openings
x-sources:
  server: https://developers.recruiterbox.com/reference/recruiterbox-public-api.md
  auth: https://developers.recruiterbox.com/reference/recruiterbox-public-api.md
servers:
  - url: https://api.recruiterbox.com/v2
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: API key as basic username, blank password
security:
  - basic: []
