openapi: 3.1.0
info:
  title: Prive API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Prive API: its host and a bearer token. It lists no endpoints. Prive publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /api/v1/subscriptions refuses a request without credentials (HTTP 401). Prive is now part of Recurly Commerce, so its API host is documented on Recurly's site."
x-auth-only: true
x-checked-endpoint: /api/v1/subscriptions
x-sources:
  server: https://docs.recurly.com/recurly-commerce/reference/publicapicontroller_getbillingattemptsbysubscriptionid
  auth: https://developers.tryprive.com/reference/getting-started-with-prive-api
servers:
  - url: https://subs.api.tryprive.com
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Request from Prive support (cs@tryprive.com)
security:
  - bearer: []
