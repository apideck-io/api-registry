openapi: 3.1.0
info:
  title: Oracle Aconex API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Oracle Aconex API: its host and its OAuth 2.0 endpoints. It lists no endpoints. Oracle Aconex publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://help.aconex.com/apis/implement-smart-construction-platform-oauth/
  tokenUrl: https://help.aconex.com/apis/implement-smart-construction-platform-oauth/
  server: https://help.aconex.com/apis/implement-smart-construction-platform-oauth/
  tokenEndpointAuthMethod: https://help.aconex.com/apis/implement-smart-construction-platform-oauth/
servers:
  - url: https://api.aconex.com/api
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_basic
      flows:
        authorizationCode:
          authorizationUrl: https://constructionandengineering.oraclecloud.com/auth/authorize
          tokenUrl: https://constructionandengineering.oraclecloud.com/auth/token
          scopes: {}
security:
  - oauth2: []
