openapi: 3.1.0
info:
  title: Twenty CRM API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Twenty CRM API: its host and a bearer token. It lists no endpoints. Twenty CRM generates its OpenAPI specification per workspace, complete only with a workspace token, so no public spec lists its endpoints; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /rest/companies refuses a request without credentials (HTTP 403)."
x-auth-only: true
x-checked-endpoint: /rest/companies
x-sources:
  server: https://docs.twenty.com/developers/extend/api
  auth: https://docs.twenty.com/developers/extend/api
servers:
  - url: https://api.twenty.com
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Settings > Developers > API > + Create key
security:
  - bearer: []
