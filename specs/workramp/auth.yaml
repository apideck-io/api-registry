openapi: 3.1.0
info:
  title: WorkRamp API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the WorkRamp API: its host and a bearer token. It lists no endpoints. WorkRamp publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /users?limit=1 refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /users?limit=1
x-sources:
  server: https://developers.workramp.com/reference/basic-auth.md
  auth: https://developers.workramp.com/reference/basic-auth.md
servers:
  - url: https://app.workramp.com/api/v1
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Admin user's API key as Bearer
security:
  - bearer: []
