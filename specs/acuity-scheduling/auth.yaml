openapi: 3.1.0
info:
  title: Acuity Scheduling API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Acuity Scheduling API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Acuity Scheduling publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.acuityscheduling.com/docs/oauth2
  tokenUrl: https://developers.acuityscheduling.com/docs/oauth2
  server: https://developers.acuityscheduling.com/docs/oauth2
  scopes: https://developers.acuityscheduling.com/docs/oauth2
  tokenEndpointAuthMethod: https://developers.acuityscheduling.com/docs/oauth2
servers:
  - url: https://acuityscheduling.com/api/v1
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://acuityscheduling.com/oauth2/authorize
          tokenUrl: https://acuityscheduling.com/oauth2/token
          scopes:
            api-v1: ""
security:
  - oauth2: []
