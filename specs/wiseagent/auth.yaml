openapi: 3.1.0
info:
  title: Wise Agent API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Wise Agent API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. The API is a single RPC-style endpoint, the server URL itself, called with a request parameter. Wise Agent publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://wiseagent.com/docs/api.asp
  tokenUrl: https://wiseagent.com/docs/api.asp
  server: https://wiseagent.com/docs/api.asp
  scopes: https://wiseagent.com/docs/api.asp
servers:
  - url: https://sync.thewiseagent.com/http/webconnect.asp
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sync.wiseagent.com/WiseAuth/auth
          tokenUrl: https://sync.wiseagent.com/WiseAuth/token
          scopes:
            profile: Read profile information including Email, Name, Company
            team: Read or Update inside team members / update inside team assignments
            marketing: Read or Update marketing programs
            contacts: Read, Update, or Create contacts.
            properties: Read or Update properties.
            calendar: Read or Update Calendar/Planner.
security:
  - oauth2: []
