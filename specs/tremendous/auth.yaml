openapi: 3.1.0
info:
  title: Tremendous API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Tremendous API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Tremendous publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.tremendous.com/docs/oauth-20
  tokenUrl: https://developers.tremendous.com/docs/oauth-20
  server: https://developers.tremendous.com/docs/production-api-access
  scopes: https://developers.tremendous.com/docs/oauth-20
  tokenEndpointAuthMethod: https://developers.tremendous.com/docs/oauth-20
servers:
  - url: https://api.tremendous.com/api/v2
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://api.tremendous.com/oauth/authorize
          tokenUrl: https://api.tremendous.com/oauth/token
          scopes:
            default: "Access to most core resources: orders, rewards, products, campaigns, funding sources, invoices, fields."
            team_management: Access to organizations, members, and webhooks endpoints.
            fraud_prevention: Access to fraud reviews and configuration rules.
security:
  - oauth2: []
