openapi: 3.1.0
info:
  title: Help Scout Docs API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Help Scout Docs API: its host and HTTP basic credentials. It lists no endpoints. Help Scout Docs publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /v1/collections refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /v1/collections
x-sources:
  server: https://developer.helpscout.com/docs-api/
  auth: https://developer.helpscout.com/docs-api/
servers:
  - url: https://docsapi.helpscout.net
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Docs API key as username, dummy password X
security:
  - basic: []
