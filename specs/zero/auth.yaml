openapi: 3.1.0
info:
  title: Zero API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Zero API: its host and a bearer token. It lists no endpoints. Zero publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /api/workspaces?fields=id,name refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /api/workspaces?fields=id,name
x-sources:
  server: https://docs.zero.inc/developers/api/introduction
  auth: https://docs.zero.inc/developers/api/authentication
servers:
  - url: https://api.zero.inc
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Settings > Connections > API keys
security:
  - bearer: []
