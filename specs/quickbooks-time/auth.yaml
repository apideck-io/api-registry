openapi: 3.1.0
info:
  title: QuickBooks Time API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the QuickBooks Time API: its host and its OAuth 2.0 endpoints. It lists no endpoints. QuickBooks Time publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://tsheetsteam.github.io/api_docs/#oauth2-0
  tokenUrl: https://tsheetsteam.github.io/api_docs/#oauth2-0
  server: https://tsheetsteam.github.io/api_docs/#base-url
servers:
  - url: https://rest.tsheets.com/api/v1
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://rest.tsheets.com/api/v1/authorize
          tokenUrl: https://rest.tsheets.com/api/v1/grant
          scopes: {}
security:
  - oauth2: []
