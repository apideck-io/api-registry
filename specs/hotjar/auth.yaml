openapi: 3.1.0
info:
  title: Hotjar API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Hotjar API: its host and its OAuth 2.0 client-credentials flow. It lists no endpoints. Hotjar publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: the token endpoint refuses a request with made-up client credentials (HTTP 401)."
x-auth-only: true
x-sources:
  server: https://help.hotjar.com/hc/en-us/articles/12244109929751-Hotjar-API-Reference
  tokenUrl: https://help.hotjar.com/hc/en-us/articles/12244109929751-Hotjar-API-Reference
  tokenEndpointAuthMethod: https://help.hotjar.com/hc/en-us/articles/12244109929751-Hotjar-API-Reference
servers:
  - url: https://api.hotjar.io
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.hotjar.io/v1/oauth/token
          scopes: {}
      x-token-endpoint-auth-method: client_secret_post
security:
  - oauth2: []
