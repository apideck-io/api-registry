openapi: 3.1.0
info:
  title: Cloudbeds API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Cloudbeds API: its host and its OAuth 2.0 endpoints. It lists no endpoints. Cloudbeds publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.cloudbeds.com/docs/alternative-oauth-20-authentication-method
  tokenUrl: https://developers.cloudbeds.com/reference/post_access-token-2
  server: https://developers.cloudbeds.com/reference/post_access-token-2
  tokenEndpointAuthMethod: https://developers.cloudbeds.com/reference/post_access-token-2
servers:
  - url: https://api.cloudbeds.com/api/v1.3
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://api.cloudbeds.com/api/v1.3/oauth
          tokenUrl: https://api.cloudbeds.com/api/v1.3/access_token
          scopes: {}
security:
  - oauth2: []
