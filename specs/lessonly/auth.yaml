openapi: 3.1.0
info:
  title: Lessonly API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Lessonly API: its host and HTTP basic credentials. It lists no endpoints. Lessonly publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /users refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /users
x-sources:
  server: https://docs.lessonly.com/
  auth: https://docs.lessonly.com/
servers:
  - url: https://api.lessonly.com/api/v1
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Username = company subdomain, password = API key
security:
  - basic: []
