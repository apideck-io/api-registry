openapi: 3.1.0
info:
  title: LoyaltyLion API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the LoyaltyLion API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. LoyaltyLion publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.loyaltylion.com/api-reference/authentication/oauth
  tokenUrl: https://developers.loyaltylion.com/api-reference/authentication/oauth
  server: https://developers.loyaltylion.com/api-reference/authentication/oauth
  scopes: https://developers.loyaltylion.com/api-reference/authentication/oauth
  tokenEndpointAuthMethod: https://developers.loyaltylion.com/api-reference/authentication/oauth
servers:
  - url: https://api.loyaltylion.com/v2
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://app.loyaltylion.com/oauth/authorize
          tokenUrl: https://app.loyaltylion.com/oauth/access-token
          scopes:
            read_customers: Read customers, points, tiers, rewards, activities
            write_customers: Read/write customers
            read_unsubscribes: Read loyalty email unsubscribes
            write_unsubscribes: Read/write unsubscribes
            read_orders: Read orders
            write_orders: Read/write orders
            write_configuration: Modify program configuration
            read_reviews: Read reviews
            write_reviews: Read/write reviews
security:
  - oauth2: []
