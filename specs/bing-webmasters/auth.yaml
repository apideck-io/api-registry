openapi: 3.1.0
info:
  title: Bing Webmaster Tools API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Bing Webmaster Tools API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Bing Webmaster Tools publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://learn.microsoft.com/en-us/bingwebmaster/oauth2
  tokenUrl: https://learn.microsoft.com/en-us/bingwebmaster/oauth2
  server: https://learn.microsoft.com/en-us/bingwebmaster/oauth2
  scopes: https://learn.microsoft.com/en-us/bingwebmaster/oauth2
  tokenEndpointAuthMethod: https://learn.microsoft.com/en-us/bingwebmaster/oauth2
servers:
  - url: https://www.bing.com/webmaster/api.svc/json
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://www.bing.com/webmasters/OAuth/authorize
          tokenUrl: https://www.bing.com/webmasters/oauth/token
          scopes:
            webmaster.read: Read access to the user's Bing Webmaster Tools data
            webmaster.manage: Read and write access to the user's Bing Webmaster Tools data
security:
  - oauth2: []
