openapi: 3.1.0
info:
  title: Chatarmin API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Chatarmin API: its host and a bearer token. It lists no endpoints. Chatarmin publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /campaigns refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /campaigns
x-sources:
  server: https://apidocs.chatarmin.com/reference/get_campaigns
  auth: https://apidocs.chatarmin.com/reference/api-overview
servers:
  - url: https://api.chatarmin.com/api/public
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Profile > Settings > API token
security:
  - bearer: []
