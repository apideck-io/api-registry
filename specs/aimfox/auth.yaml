openapi: 3.1.0
info:
  title: Aimfox API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Aimfox API: its host and a bearer token. It lists no endpoints. Aimfox publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /accounts refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /accounts
x-sources:
  server: https://docs.aimfox.com/api
  auth: https://docs.aimfox.com/api
servers:
  - url: https://api.aimfox.com/api/v3
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Workspace Settings > Integrations (API keys); use a normal key, not the master key
security:
  - bearer: []
