openapi: 3.1.0
info:
  title: Read AI API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Read AI API: its host and its OAuth 2.0 endpoints. It lists no endpoints. Read AI publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://authn.read.ai/.well-known/openid-configuration
  tokenUrl: https://support.read.ai/hc/en-us/articles/49380809380371-API-Keys-Authentication
  server: https://support.read.ai/hc/en-us/articles/49380809380371-API-Keys-Authentication
servers:
  - url: https://api.read.ai
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://authn.read.ai/oauth2/auth
          tokenUrl: https://authn.read.ai/oauth2/token
          scopes: {}
security:
  - oauth2: []
