openapi: 3.1.0
info:
  title: Formstack Documents API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Formstack Documents API: its host and HTTP basic credentials. It lists no endpoints. Formstack Documents publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /documents refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /documents
x-sources:
  server: https://www.webmerge.me/developers
  auth: https://www.webmerge.me/developers
servers:
  - url: https://www.webmerge.me/api
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: API key as username, API secret as password
security:
  - basic: []
