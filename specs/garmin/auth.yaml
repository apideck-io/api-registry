openapi: 3.1.0
info:
  title: Garmin Connect API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Garmin Connect API: its host and its OAuth 2.0 endpoints. It lists no endpoints. Garmin Connect publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developerportal.garmin.com/sites/default/files/OAuth2PKCE_1.pdf
  tokenUrl: https://developerportal.garmin.com/sites/default/files/OAuth2PKCE_1.pdf
  server: https://developerportal.garmin.com/sites/default/files/OAuth2PKCE_1.pdf
servers:
  - url: https://apis.garmin.com
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      x-pkce-required: true
      flows:
        authorizationCode:
          authorizationUrl: https://connect.garmin.com/oauth2Confirm
          tokenUrl: https://diauth.garmin.com/di-oauth2-service/oauth/token
          scopes: {}
security:
  - oauth2: []
