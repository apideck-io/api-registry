openapi: 3.1.0
info:
  title: Autosana API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Autosana API: its host and an API key sent in the X-API-Key header. It lists no endpoints. Autosana publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /api/v1/suites refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /api/v1/suites
x-sources:
  server: https://docs.autosana.ai/api-reference
  auth: https://docs.autosana.ai/api-reference
servers:
  - url: https://backend.autosana.ai
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Settings > API Keys
security:
  - apiKey: []
