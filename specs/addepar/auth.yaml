openapi: 3.1.0
info:
  title: Addepar API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Addepar API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Addepar publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.addepar.com/docs/oauth
  tokenUrl: https://developers.addepar.com/docs/oauth
  server: https://developers.addepar.com/docs/urls
  scopes: https://developers.addepar.com/docs/oauth
servers:
  - url: https://api.addepar.com
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://id.addepar.com/oauth2/authorize
          tokenUrl: https://api.addepar.com/public/oauth2/token
          scopes:
            PROFILE: Read-only name, email, user ID and firm ID
            PORTFOLIO: Read-only portfolio data
            TRANSACTIONS: Read-only transactions
            TRANSACTIONS_WRITE: Read/write transactions
            FILES: Read-only files
            FILES_WRITE: Read/write files
            GROUPS: Read-only groups
            GROUPS_WRITE: Read/write groups
            ENTITIES: Read-only entities
            ENTITIES_WRITE: Read/write entities
            POSITIONS: Read-only positions
            POSITIONS_WRITE: Read/write positions
            USERS: Read-only users/contacts
            USERS_WRITE: Read/write users/contacts
            TEAMS: Read-only teams
            TEAMS_WRITE: Read/write teams
            AUDIT_TRAIL: Read-only audit logs
            REPORTS_WRITE: Report generation
            BENCHMARKS_READ: Read-only benchmarks
            BENCHMARKS_WRITE: Read/write benchmarks
            BILLING_READ: Read-only billable portfolios
            BILLING_WRITE: Read/write billable portfolios
security:
  - oauth2: []
