openapi: 3.1.0
info:
  title: Pocket API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Pocket API: its host and a bearer token. It lists no endpoints. Pocket publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /public/recordings refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /public/recordings
x-sources:
  server: https://docs.heypocketai.com/docs/api
  auth: https://docs.heypocketai.com/docs/api
servers:
  - url: https://public.heypocketai.com/api/v1
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Pocket Settings > Developer > API Keys (pk_...)
security:
  - bearer: []
