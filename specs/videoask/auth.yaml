openapi: 3.1.0
info:
  title: VideoAsk API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the VideoAsk API: its host and its OAuth 2.0 endpoints. It lists no endpoints. VideoAsk publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.videoask.com/
  tokenUrl: https://developers.videoask.com/
  server: https://developers.videoask.com/
servers:
  - url: https://api.videoask.com
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://auth.videoask.com/authorize
          tokenUrl: https://auth.videoask.com/oauth/token
          scopes: {}
security:
  - oauth2: []
