openapi: 3.1.0
info:
  title: Planning Center API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Planning Center API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Planning Center publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://api.planningcenteronline.com/docs/overview/authentication
  tokenUrl: https://api.planningcenteronline.com/docs/overview/authentication
  server: https://api.planningcenteronline.com/docs/overview/authentication
  scopes: https://api.planningcenteronline.com/docs/overview/authentication
  tokenEndpointAuthMethod: https://api.planningcenteronline.com/docs/overview/authentication
servers:
  - url: https://api.planningcenteronline.com
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://api.planningcenteronline.com/oauth/authorize
          tokenUrl: https://api.planningcenteronline.com/oauth/token
          scopes:
            api: API
            calendar: Calendar
            check_ins: Check-Ins
            giving: Giving
            groups: Groups
            home: Home
            people: People
            publishing: Publishing
            registrations: Registrations
            services: Services
security:
  - oauth2: []
