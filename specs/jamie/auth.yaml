openapi: 3.1.0
info:
  title: Jamie API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Jamie API: its host and an API key sent in the x-api-key header. It lists no endpoints. Jamie publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /v1/me/meetings.list refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /v1/me/meetings.list
x-sources:
  server: https://docs.meetjamie.ai/developers/api/api
  auth: https://docs.meetjamie.ai/developers/api/getting-started
servers:
  - url: https://beta-api.meetjamie.ai
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Settings > Developers > API Keys (Pro/Team/Enterprise); workspace keys use /v1/workspace/*
security:
  - apiKey: []
