openapi: 3.1.0
info:
  title: EasyPost API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the EasyPost API: its host and HTTP basic credentials. It lists no endpoints. EasyPost publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /shipments refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /shipments
x-sources:
  server: https://docs.easypost.com/docs/shipments.md
  auth: https://docs.easypost.com/docs/authentication.md
servers:
  - url: https://api.easypost.com/v2
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: API key as Basic username, no password
security:
  - basic: []
