openapi: 3.1.0
info:
  title: Readwise API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Readwise API: its host and an API key sent in the Authorization header. It lists no endpoints. Readwise publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /auth/ refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /auth/
x-sources:
  server: https://readwise.io/api_deets
  auth: https://readwise.io/api_deets
servers:
  - url: https://readwise.io/api/v2
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Get the token at readwise.io/access_token. The header value is "Token <key>", not Bearer.
      x-value-template: Token {key}
security:
  - apiKey: []
