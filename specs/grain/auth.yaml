openapi: 3.1.0
info:
  title: Grain API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Grain API: its host and its OAuth 2.0 endpoints and scopes. It lists no endpoints. Grain publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developers.grain.com/authentication.html
  tokenUrl: https://developers.grain.com/endpoints.html
  server: https://developers.grain.com/overview.html
  scopes: https://developers.grain.com/authentication.html
  tokenEndpointAuthMethod: https://developers.grain.com/endpoints.html
servers:
  - url: https://api.grain.com/_/public-api/v2
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://grain.com/_/public-api/oauth2/authorize
          tokenUrl: https://api.grain.com/_/public-api/oauth2/token
          scopes:
            personal: Same access as the authorizing user (default)
            workspace: Workspace-wide access; not on all plans
security:
  - oauth2: []
