openapi: 3.1.0
info:
  title: Wappalyzer API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Wappalyzer API: its host and an API key sent in the x-api-key header. It lists no endpoints. Wappalyzer publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /credits/balance/ refuses a request without credentials (HTTP 403)."
x-auth-only: true
x-checked-endpoint: /credits/balance/
x-sources:
  server: https://www.wappalyzer.com/docs/api/v2/basics/
  auth: https://www.wappalyzer.com/docs/api/v2/basics/
servers:
  - url: https://api.wappalyzer.com/v2
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Create in your Wappalyzer account (lookup needs Business plan)
security:
  - apiKey: []
