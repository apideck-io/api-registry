openapi: 3.1.0
info:
  title: Discogs (Personal Access Token) API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Discogs (Personal Access Token) API: its host and an API key sent in the token query parameter. It lists no endpoints. Discogs (Personal Access Token) publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /oauth/identity refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /oauth/identity
x-sources:
  server: https://www.discogs.com/developers
  auth: https://www.discogs.com/developers
servers:
  - url: https://api.discogs.com
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: token
      description: "Developer Settings > Generate token; header form also documented: Authorization: Discogs token=<token>"
security:
  - apiKey: []
