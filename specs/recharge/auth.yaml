openapi: 3.1.0
info:
  title: Recharge API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Recharge API: its host and an API key sent in the X-Recharge-Access-Token header. It lists no endpoints. Recharge publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /store refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /store
x-sources:
  server: https://developer.rechargepayments.com/2021-11/authentication
  auth: https://developer.rechargepayments.com/2021-11/authentication
servers:
  - url: https://api.rechargeapps.com
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Recharge-Access-Token
      description: Recharge API token edit page (needs read_store scope)
security:
  - apiKey: []
