openapi: 3.1.0
info:
  title: Uber API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Uber API: its host and its OAuth 2.0 endpoints. It lists no endpoints. Uber publishes no OpenAPI specification; every value here comes from the vendor's developer documentation, cited per value in x-sources. Checked 2026-11-02."
x-auth-only: true
x-sources:
  authorizationUrl: https://developer.uber.com/docs/drivers/guides/authentication
  tokenUrl: https://developer.uber.com/docs/consumer-identity/references/api/v2/token-post
  server: https://developer.uber.com/docs/drivers/guides/authentication
servers:
  - url: https://api.uber.com
paths: {}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      x-token-endpoint-auth-method: client_secret_post
      flows:
        authorizationCode:
          authorizationUrl: https://auth.uber.com/oauth/v2/authorize
          tokenUrl: https://auth.uber.com/oauth/v2/token
          scopes: {}
security:
  - oauth2: []
