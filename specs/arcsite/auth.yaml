openapi: 3.1.0
info:
  title: ArcSite API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the ArcSite API: its host and a bearer token. It lists no endpoints. ArcSite publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /projects refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /projects
x-sources:
  server: https://dev.arcsite.com/quickstart/
  auth: https://dev.arcsite.com/authentication/
servers:
  - url: https://api.arcsite.com/v1
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Admin > Developers > API tokens (company admin; plan must include Developer API)
security:
  - bearer: []
