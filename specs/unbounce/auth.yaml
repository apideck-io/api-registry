openapi: 3.1.0
info:
  title: Unbounce API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Unbounce API: its host, HTTP basic credentials, and its OAuth 2.0 authorization-code flow. It lists no endpoints. Unbounce publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /accounts refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /accounts
x-sources:
  server: https://developer.unbounce.com/getting_started/
  auth: https://developer.unbounce.com/getting_started/
  authorizationUrl: https://developer.unbounce.com/getting_started/
  tokenUrl: https://developer.unbounce.com/getting_started/
  scopes: https://developer.unbounce.com/getting_started/
servers:
  - url: https://api.unbounce.com
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: "API key as username, empty password; send Accept: application/vnd.unbounce.api.v0.4+json"
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.unbounce.com/oauth/authorize
          tokenUrl: https://api.unbounce.com/oauth/token
          scopes:
            full: ""
security:
  - basic: []
  - oauth2: []
