openapi: 3.1.0
info:
  title: Unbounce API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Unbounce API: its host and HTTP basic credentials. It lists no endpoints. Unbounce publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /accounts refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /accounts
x-sources:
  server: https://developer.unbounce.com/getting_started/
  auth: https://developer.unbounce.com/getting_started/
servers:
  - url: https://api.unbounce.com
paths: {}
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: "API key as username, empty password; send Accept: application/vnd.unbounce.api.v0.4+json"
security:
  - basic: []
