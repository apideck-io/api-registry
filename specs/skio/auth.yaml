openapi: 3.1.0
info:
  title: Skio API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Skio API: its host and an API key sent in the authorization header. It lists no endpoints. Skio publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /orders?first=1 refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /orders?first=1
x-sources:
  server: https://code.skio.com/rest-api/
  auth: https://code.skio.com/rest-api/
servers:
  - url: https://api.skio.com/public-rest-api-http
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: authorization
      description: From the Skio dashboard, API & Integrations, API. The header value is "API <token>". The main API is GraphQL (POST https://graphql.skio.com/v1/graphql); this server is the REST export API.
      x-value-template: API {key}
security:
  - apiKey: []
