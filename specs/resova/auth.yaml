openapi: 3.1.0
info:
  title: Resova API (authentication only)
  version: "0"
  description: "Authentication only. This document describes how to authenticate with the Resova API: its host and an API key sent in the X-API-KEY header. It lists no endpoints. Resova publishes no OpenAPI specification; every value here comes from the vendor's own documentation, cited per value in x-sources. Checked 2026-11-02: /items refuses a request without credentials (HTTP 401)."
x-auth-only: true
x-checked-endpoint: /items
x-sources:
  server: https://developers.resova.com/reference/itemsindex.md
  auth: https://developers.resova.com/reference/authentication
servers:
  - url: https://api.resova.us/v1
paths: {}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key from Settings > General Settings > Developer; caller IP must be whitelisted
security:
  - apiKey: []
